
name: Generate Contribution Snake

on:
  # Generate the snake every day at 00:00 Mexico time (UTC-6)
  schedule:
    - cron: "0 6 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generate the contribution snake SVG files
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publish generated files to the output branch
      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
